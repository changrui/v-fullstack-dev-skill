<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V 语言：从入门到精通</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#11151c; --card:#161b22; --card2:#1c2230;
    --line:#283142; --txt:#e6edf3; --mut:#9aa7b5; --acc:#41a6f6; --acc2:#7c5cff;
    --grn:#3fb950; --red:#f85149; --ylw:#e3b341; --pink:#ff7b9c;
    --sh:0 10px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 800px at 80% -10%, #1b2440 0%, transparent 60%),
               radial-gradient(1000px 700px at -10% 110%, #1a2b2e 0%, transparent 55%),
               var(--bg);
    color:var(--txt);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    overflow:hidden;
  }
  /* ===== Top bar ===== */
  #bar{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;
    gap:14px;padding:0 18px;background:linear-gradient(180deg,rgba(13,17,23,.92),rgba(13,17,23,.62));
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:40}
  #bar .logo{font-weight:800;font-size:18px;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  #bar .sp{flex:1}
  #bar #clock{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px}
  #bar .btn{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--txt);
    padding:6px 11px;border-radius:8px;font-size:13px;transition:.15s}
  #bar .btn:hover{border-color:var(--acc);color:var(--acc)}

  /* ===== Deck ===== */
  #deck{position:fixed;inset:54px 0 0 0;overflow:hidden}
  .slide{position:absolute;inset:0;padding:46px 70px;overflow:auto;
    display:flex;flex-direction:column;opacity:0;pointer-events:none;
    transition:transform .62s cubic-bezier(.22,.9,.3,1),opacity .5s ease}
  .slide.active{opacity:1;pointer-events:auto;transform:translateX(0)!important}
  .kicker{color:var(--acc);font-weight:700;letter-spacing:2px;font-size:13px;text-transform:uppercase;margin-bottom:6px}
  h1{font-size:40px;line-height:1.15;margin-bottom:14px;font-weight:800}
  h2{font-size:30px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px}
  h2 .num{font-size:15px;color:var(--acc);border:1px solid var(--acc);border-radius:8px;padding:2px 9px;font-weight:700}
  p.lead{color:var(--mut);font-size:16px;max-width:1000px;margin-bottom:18px;line-height:1.7}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;box-shadow:var(--sh)}
  .card h3{font-size:16px;margin-bottom:8px;color:var(--acc)}
  .card p,.card li{color:var(--mut);font-size:14px;line-height:1.65}
  .card ul{margin-left:18px}
  .kbd{display:inline-block;background:#0b0f14;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:6px;padding:1px 8px;font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--acc)}
  /* code */
  pre{background:#0a0e13;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    overflow:auto;font-size:13.5px;line-height:1.6;box-shadow:var(--sh)}
  code{font-family:ui-monospace,"Cascadia Code",Consolas,monospace}
  pre code{color:#c9d4e0;white-space:pre}
  .c{color:#6b7787} /* comment */
  .k{color:#ff7b9c} /* keyword */
  .s{color:#9ece6a} /* string */
  .f{color:#7dcfff} /* function */
  .t{color:#e3b341} /* type */
  .n{color:#ff9e64} /* number */
  .tw{background:#0b0f14;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--acc);font-size:12.5px}
  /* index */
  #index{position:fixed;inset:54px 0 0 0;background:rgba(8,11,16,.96);backdrop-filter:blur(6px);
    z-index:50;display:none;padding:40px 60px;overflow:auto}
  #index.open{display:block}
  #index h2{margin-bottom:18px}
  .idxgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:1100px}
  .idxgrid a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--txt);
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:.15s;font-size:14px}
  .idxgrid a:hover{border-color:var(--acc);transform:translateX(3px);color:var(--acc)}
  .idxgrid a .i{color:var(--acc);font-weight:700;min-width:22px}
  .idxgrid a .tt{color:var(--mut)}
  /* progress dots */
  #dots{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:35;display:flex;flex-direction:column;gap:7px;max-height:80vh;overflow:auto}
  #dots .d{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
  #dots .d.on{background:var(--acc);transform:scale(1.4)}
  #dots .d:hover{background:var(--acc2)}
  /* footer nav */
  #nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:35;display:flex;align-items:center;gap:14px;
    background:rgba(22,27,34,.85);border:1px solid var(--line);padding:8px 14px;border-radius:30px;backdrop-filter:blur(6px)}
  #nav .pg{color:var(--mut);font-size:13px;min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
  #nav .nb{cursor:pointer;border:none;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;
    width:34px;height:34px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.15s}
  #nav .nb:hover{filter:brightness(1.12)}
  #nav .nb:disabled{opacity:.35;cursor:not-allowed}
  .pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--mut);margin-right:6px}
  .pill.acc{color:var(--acc);border-color:var(--acc)}
  .pill.grn{color:var(--grn);border-color:var(--grn)}
  .pill.red{color:var(--red);border-color:var(--red)}
  .pill.ylw{color:var(--ylw);border-color:var(--ylw)}
  .tip{background:linear-gradient(180deg,#15251c,#13201a);border:1px solid #2c4a36;border-left:3px solid var(--grn);
    border-radius:10px;padding:12px 14px;color:#bcd9c5;font-size:14px;line-height:1.6}
  .warn{background:linear-gradient(180deg,#2a1a1c,#241718);border:1px solid #502a2e;border-left:3px solid var(--red);
    border-radius:10px;padding:12px 14px;color:#e7c2c4;font-size:14px;line-height:1.6}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid var(--line);padding:8px 11px;text-align:left}
  th{background:var(--card2);color:var(--acc)}
  td{color:var(--mut)}
  .big{font-size:64px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .taglist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
</style>
</head>
<body>
<div id="bar">
  <div class="logo">⌘ V 语言</div>
  <div class="sp"></div>
  <div id="clock"></div>
  <div class="btn" id="btnIdx">☰ 索引</div>
  <div class="btn" id="btnRand">🎲 随机</div>
  <div class="btn" id="btnFull">⛶ 全屏</div>
</div>

<div id="deck"></div>

<div id="index">
  <h2><span class="num">#</span> 内容索引 · 点击直达</h2>
  <div class="idxgrid" id="idxgrid"></div>
</div>

<div id="dots"></div>

<div id="nav">
  <button class="nb" id="prev">‹</button>
  <div class="pg" id="pg">1 / 1</div>
  <button class="nb" id="next">›</button>
</div>

/* 4 变量与类型 */
{ kicker:"BASICS", title:"变量与基础类型",
  html:`<div class="grid g2">
   <div>
    <pre><code><span class="c">// 不可变（默认）</span>
x := <span class="n">42</span>
s := <span class="s">'V lang'</span>
f := <span class="n">3.14</span>
b := <span class="k">true</span>

<span class="c">// 可变必须加 mut</span>
mut n := <span class="n">0</span>
n = n + <span class="n">1</span>

<span class="c">// 显式类型标注</span>

   </div>
   <div>
    <div class="card"><h3>基础类型</h3>
     <table>
      <tr><th>类型</th><th>说明</th></tr>

      <tr><td><span class="tw">f32</span>/<span class="tw">f64</span></td><td>浮点</td></tr>
      <tr><td><span class="tw">bool</span></td><td>true / false</td></tr>
      <tr><td><span class="tw">string</span></td><td>UTF-8 字符串</td></tr>
      <tr><td><span class="tw">rune</span></td><td>单个 Unicode 字符</td></tr>
      <tr><td><span class="tw">byte</span></td><td>u8</td></tr>
     </table></div>
    <div class="card" style="margin-top:14px"><h3>类型推断</h3>
     <pre><code>y := <span class="n">10</span>        <span class="c">// int</span>
z := <span class="n">10.0</span>      <span class="c">// f64</span>
arr := [<span class="n">1</span>,<span class="n">2</span>,<span class="n">3</span>] <span class="c">// []int</span></code></pre></div>
   </div>
  </div>` },

/* 5 函数 */
{ kicker:"FUNCTIONS", title:"函数",
  html:`<div class="grid g2">
   <div>
    <pre><code><span class="c">// 多返回值（无需元组）</span>
<span class="k">fn</span> <span class="f">divmod</span>(a <span class="t">int</span>, b <span class="t">int</span>) (<span class="t">int</span>, <span class="t">int</span>) {
    <span class="k">return</span> a / b, a % b
}
q, r := divmod(<span class="n">17</span>, <span class="n">5</span>)

<span class="c">// 默认参数</span>
<span class="k">fn</span> <span class="f">greet</span>(name <span class="t">string</span>, loud <span class="t">bool</span> = <span class="k">false</span>) {

}</code></pre>
   </div>
   <div>
    <pre><code><span class="c">// 可变参数</span>
<span class="k">fn</span> <span class="f">sum</span>(nums <span class="t">...int</span>) <span class="t">int</span> {
    mut total := <span class="n">0</span>
    <span class="k">for</span> n <span class="k">in</span> nums { total += n }
    <span class="k">return</span> total
}
println(sum(<span class="n">1</span>,<span class="n">2</span>,<span class="n">3</span>))  <span class="c">// 6</span>

<span class="c">// 函数即值</span>
f := <span class="f">println</span>
f(<span class="s">'hi'</span>)</code></pre>
    <div class="warn">避坑：V 没有「重载」。同名函数只能有一个；想表达可选参数请用默认参数或可变参数。</div>
   </div>
  </div>` },

/* 6 控制流 */
{ kicker:"CONTROL FLOW", title:"控制流：if / for / match",
  html:`<div class="grid g2">
   <div>
    <pre><code><span class="c">// if 无需括号，条件非 bool 会报错</span>
<span class="k">if</span> x > <span class="n">10</span> { println(<span class="s">'big'</span>) }
<span class="k">else if</span> x > <span class="n">5</span> { println(<span class="s">'mid'</span>) }
<span class="k">else</span> { println(<span class="s">'small'</span>) }

<span class="c">// 三目表达式</span>
s := <span class="k">if</span> ok { <span class="s">'yes'</span> } <span class="k">else</span> { <span class="s">'no'</span> }

<span class="c">// for —— 仅此一种循环关键字</span>
<span class="k">for</span> i := <span class="n">0</span>; i < <span class="n">3</span>; i++ { }
<span class="k">for</span> i <span class="k">in</span> <span class="n">0</span>..<span class="n">3</span> { }
<span class="k">for</span> e <span class="k">in</span> arr { }
<span class="k">for</span> { }                <span class="c">// 死循环</span>
<span class="k">for</span> i, e <span class="k">in</span> arr { }  <span class="c">// 带下标</span></code></pre>
   </div>
   <div>
    <pre><code><span class="c">// match —— 比 switch 更强</span>
<span class="k">match</span> cmd {
    <span class="s">'start'</span> { start() }
    <span class="s">'stop'</span>  { stop() }
    <span class="s">'ping'</span>, <span class="s">'pong'</span> { pong() }
    <span class="k">else</span>     { println(<span class="s">'unknown'</span>) }
}

<span class="c">// defer —— 退出作用域前执行</span>
<span class="k">fn</span> <span class="f">work</span>() {
    f := open_file()
    <span class="k">defer</span> { f.close() }
    <span class="c">// ... 任何退出路径都会关闭文件</span>
}</code></pre>
    <div class="tip">经验：<code>match</code> 必须覆盖全部情况或带 <code>else</code>；<code>defer</code> 非常适合资源清理，避免泄漏。</div>
   </div>
  </div>` },

/* 7 数组与 map */
{ kicker:"COLLECTIONS", title:"数组与 map",
  html:`<div class="grid g2">
   <div>
    <pre><code><span class="c">// 数组</span>
mut a := [<span class="n">1</span>,<span class="n">2</span>,<span class="n">3</span>]
a << <span class="n">4</span>            <span class="c">// 追加</span>
println(a.len)   <span class="c">// 4</span>
a = a.filter(<span class="k">fn</span>(x <span class="t">int</span>) <span class="t">bool</span> { <span class="k">return</span> x % <span class="n">2</span> == <span class="n">0</span> })
a = a.map(<span class="k">fn</span>(x <span class="t">int</span>) <span class="t">int</span> { <span class="k">return</span> x * <span class="n">2</span> })

<span class="c">// 定长数组（栈上）</span>
fixed := [<span class="n">3</span>]<span class="t">int</span>{}
fixed[<span class="n">0</span>] = <span class="n">9</span></code></pre>
   </div>
   <div>
    <pre><code><span class="c">// map</span>
mut m := <span class="t">map</span>[<span class="t">string</span>]<span class="t">int</span>{}
m[<span class="s">'a'</span>] = <span class="n">1</span>
v := m[<span class="s">'a'</span>] <span class="k">or</span> { <span class="n">0</span> }   <span class="c">// 不存在给默认</span>

<span class="c">// 遍历</span>
<span class="k">for</span> k, val <span class="k">in</span> m {
    println(<span class="s">'\${k}=\${val}'</span>)
}</code></pre>

/* 9 方法 */
{ kicker:"METHODS", title:"方法与接收者",
  html:`<div class="grid g2">
   <div>

<span class="k">struct</span> <span class="t">Vec</span> { x <span class="t">f64</span>; y <span class="t">f64</span> }
<span class="k">fn</span> (<span class="t">v</span> <span class="t">Vec</span>) <span class="f">len</span>() <span class="t">f64</span> {
    <span class="k">return</span> (v.x*v.x + v.y*v.y).sqrt()
}

<span class="c">// 指针接收者（可修改）</span>
<span class="k">fn</span> (<span class="k">mut</span> v <span class="t">Vec</span>) <span class="f">scale</span>(k <span class="t">f64</span>) {
    v.x *= k

}</code></pre>

<span class="k">pub:</span>

<span class="k">pub mut:</span>

/* 9b 运算符重载 */
{ kicker:"OPERATORS", title:"运算符重载（原生支持）",
  html:`<div class="grid g2">
   <div>
    <pre><code><span class="c">// 为自定义类型重载四则运算与比较</span>
<span class="k">struct</span> <span class="t">Vec</span> { x <span class="t">f64</span>; y <span class="t">f64</span> }

<span class="c">// 加法：方法名固定为 +</span>
<span class="k">fn</span> (<span class="t">Vec</span>) <span class="f">+</span>(o <span class="t">Vec</span>) <span class="t">Vec</span> {
    <span class="k">return</span> <span class="t">Vec</span>{ x: x + o.x, y: y + o.y }
}
<span class="c">// 乘法、减法、除法、取模同理：* - / %</span>
<span class="k">fn</span> (<span class="t">Vec</span>) <span class="f">*</span>(k <span class="t">f64</span>) <span class="t">Vec</span> { <span class="k">return</span> <span class="t">Vec</span>{ x: x*k, y: y*k } }</code></pre>
   </div>
   <div>
    <pre><code><span class="c">// 比较：方法名固定为 == 和 &lt; 等</span>
<span class="k">fn</span> (<span class="t">Vec</span>) <span class="f">==</span>(o <span class="t">Vec</span>) <span class="t">bool</span> {
    <span class="k">return</span> x == o.x && y == o.y
}
<span class="k">fn</span> (<span class="t">Vec</span>) <span class="f">&lt;</span>(o <span class="t">Vec</span>) <span class="t">bool</span> {
    <span class="k">return</span> x*x + y*y &lt; o.x*o.x + o.y*o.y
}

a := <span class="t">Vec</span>{<span class="n">1</span>,<span class="n">2</span>} + <span class="t">Vec</span>{<span class="n">3</span>,<span class="n">4</span>}  <span class="c">// Vec{4,6}</span>
b := a * <span class="n">2</span>
println(a == b)                <span class="c">// false</span></code></pre>
    <div class="tip">经验：重载方法名只能是固定符号（+ - * / % == != &lt; &gt; &lt;= &gt;=）。定义 <code>==</code> 后，V 会自动为你推导出 <code>!=</code>，无需重复写。</div>
   </div>
  </div>` },

/* 12 错误处理 */
{ kicker:"ERRORS", title:"错误处理：Option / Result",
  html:`<div class="grid g2">
   <div>
    <pre><code><span class="c">// ? 自动向上传播错误</span>
<span class="k">fn</span> <span class="f">read</span>() !<span class="t">string</span> {

}

<span class="c">// ! 断言「不会出错」</span>
content := os.read_file(<span class="s">'a.txt'</span>) <span class="k">!</span>

<span class="c">// or {} 提供兜底</span>
v := m[key] <span class="k">or</span> { <span class="n">0</span> }</code></pre>
    <div class="card" style="margin-top:12px"><h3>Option</h3>

}</code></pre></div>
   </div>
   <div>
    <pre><code><span class="c">// 显式捕获错误</span>
<span class="k">match</span> os.read_file(<span class="s">'a.txt'</span>) {
    <span class="k">err</span> => println(<span class="s">'err: \${err}'</span>)

}

<span class="c">// 定义自己的错误</span>
<span class="k">struct</span> <span class="t">MyErr</span> { msg <span class="t">string</span> }
<span class="k">fn</span> <span class="f">f</span>() !<span class="t">int</span> {
    <span class="k">return</span> <span class="t">IError</span>(<span class="t">MyErr</span>{ msg: <span class="s">'boom'</span> })
}</code></pre>
    <div class="warn">避坑：V 没有 try/catch 异常。错误是值，必须处理（? 传播、! 断言、or{} 兜底、match 捕获）。这是「安全优先」的体现。</div>
   </div>
  </div>` },

/* 17 ORM 避坑 */
{ kicker:"GOTCHA", title:"ORM 避坑经验（真实项目）",
  html:`<div class="grid g2">
   <div>
    <div class="warn"><b>坑 1：insert 不能内联调用函数</b><br>
    不能在 <code>values()</code> 里直接调用 <code>hash_password()</code>、<code>now_str()</code>。<br>
    必须先构造结构体变量，再 <code>insert var into Table</code>。</div>
    <pre><code><span class="c">// ✗ 错误</span>
sql db { <span class="k">insert</span> <span class="k">into</span> <span class="t">User</span> (pw) <span class="k">values</span>(hash_pw(x)) }

<span class="c">// ✓ 正确</span>
u := <span class="t">User</span>{ pw: hash_pw(x) }
sql db { <span class="k">insert</span> u <span class="k">into</span> <span class="t">User</span> }</code></pre>
   </div>
   <div>
    <div class="warn"><b>坑 2：WHERE 字段名与参数冲突</b><br>
    <code>where id == id</code> 会因字段与参数同名永远为真。加 <code>limit 1</code> 或用 <code>$id</code> 区分。</div>
    <pre><code><span class="c">// ✗ 危险</span>
<span class="k">select</span> <span class="k">from</span> <span class="t">User</span> <span class="k">where</span> id == id

<span class="c">// ✓ 安全</span>
<span class="k">select</span> <span class="k">from</span> <span class="t">User</span> <span class="k">where</span> id == <span class="n">$1</span> <span class="k">limit</span> <span class="n">1</span>
<span class="c">// 或重命名参数 uid</span></code></pre>
    <div class="tip">经验：<code>insert var into Table</code> 是完整语法，不能省略 <code>into Table</code>。</div>
   </div>
  </div>` },

/* ============ 渲染 ============ */
const deck = document.getElementById('deck');
const dots = document.getElementById('dots');
const idxGrid = document.getElementById('idxgrid');
let cur = 0;
const N = SLIDES.length;

SLIDES.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  el.innerHTML = `<div class="kicker">${s.kicker || ''}</div><h1>${s.title}</h1>${s.html}`;
  deck.appendChild(el);

  const d = document.createElement('div');
  d.className = 'd';
  d.title = s.title;
  d.onclick = () => go(i);
  dots.appendChild(d);

  const a = document.createElement('a');
  a.href = '#';
  a.innerHTML = `<span class="i">${String(i+1).padStart(2,'0')}</span><span class="tt">${s.title}</span>`;
  a.onclick = (e) => { e.preventDefault(); go(i); toggleIndex(false); };
  idxGrid.appendChild(a);
});

const slides = [...document.querySelectorAll('.slide')];

/* ============ 随机切换动画 ============ */
const EASES = [
  'cubic-bezier(.22,.9,.3,1)',
  'cubic-bezier(.66,0,.34,1)',
  'cubic-bezier(.16,1,.3,1)',
  'cubic-bezier(.85,0,.15,1)',
  'cubic-bezier(.34,1.56,.64,1)',
];
const ROT = ['' , 'rotateY(8deg)', 'rotateX(6deg)', 'scale(.96)'];
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function go(target){
  target = Math.max(0, Math.min(N-1, target));
  const dir = target > cur ? 1 : -1;
  const ease = rand(EASES);
  const rot = rand(ROT);
  // 离场
  const old = slides[cur];
  old.style.transition = `transform .5s ${ease}, opacity .4s ease`;
  old.style.transform = `translateX(${-dir*60}px) ${rot}`;
  old.style.opacity = '0';
  old.classList.remove('active');
  // 入场
  cur = target;
  const nv = slides[cur];
  nv.style.transition = `transform .62s ${ease}, opacity .5s ease`;
  nv.style.transform = `translateX(${dir*60}px) ${rot}`;
  nv.style.opacity = '0';
  // 强制重排后归位
  void nv.offsetWidth;
  requestAnimationFrame(() => {
    nv.classList.add('active');
    nv.style.transform = 'translateX(0)';
    nv.style.opacity = '1';
  });
  updateUI();
}
function updateUI(){
  document.getElementById('pg').textContent = `${cur+1} / ${N}`;
  document.getElementById('prev').disabled = cur===0;
  document.getElementById('next').disabled = cur===N-1;
  dots.forEach((d,i)=> d.classList.toggle('on', i===cur));
}

/* ============ 索引开关 ============ */
function toggleIndex(force){
  const idx = document.getElementById('index');
  const open = force!==undefined ? force : !idx.classList.contains('open');
  idx.classList.toggle('open', open);
}

/* ============ 事件 ============ */
document.getElementById('next').onclick = () => go(cur+1);
document.getElementById('prev').onclick = () => go(cur-1);
document.getElementById('btnIdx').onclick = () => toggleIndex();
document.getElementById('btnRand').onclick = () => go(Math.floor(Math.random()*N));
document.getElementById('btnFull').onclick = () => {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); go(cur+1); }
  else if(e.key==='ArrowLeft') { e.preventDefault(); go(cur-1); }
  else if(e.key==='i'||e.key==='I') toggleIndex();
  else if(e.key==='r'||e.key==='R') go(Math.floor(Math.random()*N));
  else if(e.key==='f'||e.key==='F') document.getElementById('btnFull').click();
  else if(e.key==='Escape') toggleIndex(false);
});
document.getElementById('index').addEventListener('click',(e)=>{ if(e.target.id==='index') toggleIndex(false); });

/* ============ 时钟 ============ */
function tick(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent =
    `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
setInterval(tick, 1000); tick();

/* ============ 启动 ============ */
go(0);
</script>
